<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bancada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --fundo: #14171A; --area: #0E1012; --painel: #1C2024; --borda: #2A3036; --borda2: #3A424A; --ativo: #2E353C;
  --texto: #E8EAED; --sec: #9AA3AD; --placa: #1F6F4A; --cobre: #E0A458; --ok: #6FD39B; --erro: #FF8A80; --destaque: #8EC5FF;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--fundo); color: var(--texto); font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; }
a, .link { color: var(--cobre); }
.mono { font-family: var(--mono); }
.sub { font-family: var(--mono); font-size: 12px; color: var(--sec); }

/* topo */
header { position: relative; display: flex; align-items: center; gap: 12px; padding: 0 20px; min-height: 56px; border-bottom: 1px solid var(--borda); }
header .voltar { width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; margin-left: -8px; border-radius: 8px; color: var(--sec); text-decoration: none; font-size: 18px; }
header .voltar:hover { background: #262C32; color: var(--texto); }
header .nome { flex: 1 1 200px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header nav { display: flex; gap: 4px; align-self: stretch; }
header nav button { min-height: 56px; padding: 0 16px; color: var(--sec); border-bottom: 2px solid transparent; font-size: 14px; font-weight: 500; }
header nav button[aria-pressed="true"] { color: #F4F4F2; border-bottom-color: #F4F4F2; }
header .direita { flex: 1 1 200px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.pilula { min-height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--borda); border-radius: 999px; font-family: var(--mono); font-size: 12px; color: #C8CDD2; }
.versoes { position: absolute; right: 20px; top: 60px; z-index: 20; width: 300px; max-height: 70vh; overflow: auto; display: flex; flex-direction: column; gap: 4px; background: var(--painel); border: 1px solid var(--borda2); border-radius: 10px; padding: 6px; }
.versoes button { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 8px; text-align: left; }
.versoes button[aria-pressed="true"] { background: var(--ativo); }
.versoes .v { font-family: var(--mono); font-size: 12px; color: var(--sec); }
.versoes .frase { font-size: 13px; line-height: 1.4; }
.versoes label { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; margin-top: 4px; border-top: 1px solid var(--borda); font-size: 13px; color: #C8CDD2; cursor: pointer; }
.versoes input { width: 16px; height: 16px; accent-color: var(--ok); }

main { flex: 1; min-height: 0; display: flex; }
.vazio { margin: auto; color: var(--sec); font-size: 14px; text-align: center; line-height: 1.6; }

/* projeto */
.area { flex: 1; min-width: 0; position: relative; overflow: hidden; background: var(--area); user-select: none; }
.area .desenho { position: absolute; inset: 0; width: 100%; height: 100%; }
.area.mao { cursor: grab; } .area.arrastando { cursor: grabbing; }
.ferramentas { position: absolute; left: 16px; top: 16px; z-index: 5; display: flex; flex-direction: column; gap: 4px; background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 4px; }
.ferramentas button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #C8CDD2; }
.ferramentas button[aria-pressed="true"] { background: var(--ativo); color: #F4F4F2; }
.ferramentas button:hover { background: #262C32; }
.ferramentas .zoom { height: 32px; font-family: var(--mono); font-size: 11px; color: var(--sec); }
.ferramentas hr { width: 32px; border: 0; border-top: 1px solid var(--borda); margin: 4px auto; }
.aviso-versao { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 5; padding: 6px 12px; border-radius: 999px; background: var(--painel); border: 1px solid var(--borda2); font-size: 12px; color: #C8CDD2; }
.hud { position: absolute; z-index: 6; pointer-events: none; display: flex; flex-direction: column; gap: 2px; background: rgba(14,16,18,0.92); border: 1px solid var(--borda2); border-radius: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.hud .xy { color: var(--sec); }

aside.inspetor { flex: 0 0 340px; overflow: auto; padding: 20px; border-left: 1px solid var(--borda); display: flex; flex-direction: column; gap: 16px; font-size: 14px; }
.inspetor .cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.inspetor .tipo { font-size: 12px; color: var(--sec); }
.inspetor .titulo { font-family: var(--mono); font-size: 22px; font-weight: 500; word-break: break-all; }
.inspetor .fechar { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--sec); border-radius: 8px; }
.inspetor dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; }
.inspetor dt { color: var(--sec); }
.inspetor dd { margin: 0; font-family: var(--mono); font-size: 13px; word-break: break-word; }
.inspetor dd.alerta { color: var(--cobre); }
.inspetor .origem { display: flex; flex-direction: column; gap: 6px; }
.inspetor .origem span { font-size: 12px; color: var(--sec); }
.inspetor code { font-family: var(--mono); font-size: 13px; background: var(--painel); padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; }
.explica { display: flex; flex-direction: column; gap: 6px; background: #1A2230; border: 1px solid #2C3A52; border-radius: 10px; padding: 12px 14px; }
.explica b { font-size: 12px; font-weight: 600; color: var(--destaque); }
.explica p { margin: 0; line-height: 1.55; }

/* inicio: os projetos */
.inicio { flex: 1; overflow: auto; background: var(--area); padding: 40px 24px 48px; }
.inicio .miolo { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.inicio h1 { margin: 0; font-size: 22px; font-weight: 600; }
.cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.cartao { display: flex; flex-direction: column; gap: 12px; padding: 14px; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; color: var(--texto); text-decoration: none; }
.cartao:hover { border-color: var(--borda2); background: #20252A; }
.cartao .sem-placa { aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--area); color: var(--sec); font-size: 13px; }
.cartao .titulo-cartao { font-size: 15px; font-weight: 600; }
.selos { display: flex; flex-wrap: wrap; gap: 6px; }
.selo { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--borda); color: var(--sec); }
.selo.ok { color: var(--ok); } .selo.falha { color: var(--erro); } .selo.rodando { color: var(--cobre); }
svg.mini { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--area); }

/* processo: a historia do projeto em 4 passos */
.processo { flex: 1; overflow: auto; background: var(--area); padding: 32px 24px 48px; }
.passos { max-width: 760px; margin: 0 auto; padding: 0; list-style: none; display: flex; flex-direction: column; }
.passo { position: relative; display: flex; gap: 18px; padding-bottom: 28px; }
.passo:not(:last-child)::before { content: ''; position: absolute; left: 15px; top: 34px; bottom: 4px; width: 2px; background: var(--borda2); }
.passo .marca { width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 600; font-size: 14px; background: #22272C; color: #8A939C; border: 1px solid var(--borda2); }
.passo.ok .marca { background: #173A26; color: var(--ok); border-color: #24583A; }
.passo.falha .marca { background: #3A2E17; color: var(--cobre); border-color: #5A4527; }
.passo.rodando .marca { background: #3A2E17; color: var(--cobre); border-color: #5A4527; }
.passo .conteudo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 16px 18px; }
.passo h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sec); }
.passo p { margin: 0; line-height: 1.55; font-size: 14px; }
.passo .destaque { font-size: 17px; font-weight: 600; }
.passo ul, .passo ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.reqs li.ok { color: var(--ok); } .reqs li.falha { color: var(--cobre); }
.versoes-lista li { color: #C8CDD2; line-height: 1.45; }
.placa-resumo { display: grid; grid-template-columns: minmax(0, 260px) 1fr; gap: 16px; align-items: start; }
.cotacao { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--borda); padding-top: 12px; }
.cotacao dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
.cotacao dt { color: var(--sec); } .cotacao dd { margin: 0; }
.cotacao img { width: 100%; border-radius: 8px; border: 1px solid var(--borda); display: block; }
.link { min-height: 32px; padding: 0; color: var(--cobre); font-size: 13px; text-decoration: none; align-self: flex-start; display: inline-flex; align-items: center; }
@media (max-width: 640px) { .placa-resumo { grid-template-columns: 1fr; } }

/* thinking */
.thinking { flex: 1; overflow: auto; background: var(--area); padding: 32px 24px 48px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
.modos { display: flex; gap: 2px; background: var(--painel); border: 1px solid var(--borda); border-radius: 999px; padding: 3px; }
.modos button { min-height: 36px; padding: 0 16px; border-radius: 999px; font-size: 13px; }
.modos button[aria-pressed="true"] { background: var(--ativo); }
.arvore { display: flex; flex-direction: column; align-items: center; max-width: 100%; }
.objetivo { width: 360px; max-width: 100%; background: var(--painel); border: 1.5px solid var(--texto); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.objetivo .rotulo { font-size: 12px; color: var(--sec); }
.objetivo .titulo-obj { font-size: 17px; font-weight: 600; }
.objetivo p { margin: 0; font-size: 13px; color: #C8CDD2; line-height: 1.5; }
.tronco { width: 2px; height: 24px; background: var(--borda2); }
.galhos { display: flex; align-items: flex-start; max-width: 100%; overflow-x: auto; padding-bottom: 4px; }
.galho { position: relative; padding: 24px 20px 0; flex: none; }
.galho::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--borda2); }
.galho:first-child::before { left: 50%; } .galho:last-child::before { right: 50%; }
.galho:only-child::before { display: none; }
.galho::after { content: ''; position: absolute; top: 0; left: calc(50% - 1px); width: 2px; height: 24px; background: var(--borda2); }
.req { width: 220px; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.req.falha { border-color: #5A4527; }
.req .status { align-self: flex-start; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #22272C; color: var(--sec); }
.req.ok .status { background: var(--ok); color: #0E2A1A; }
.req.falha .status { background: var(--cobre); color: #2A1A05; }
.req .titulo-req { font-size: 15px; font-weight: 600; line-height: 1.35; }
.req .pecas { font-family: var(--mono); font-size: 12px; color: var(--sec); }
.req ul { margin: 0; padding: 10px 0 0; border-top: 1px solid var(--borda); list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C8CDD2; line-height: 1.4; }
.req li.checa { font-family: var(--mono); font-size: 11.5px; color: var(--sec); }
.req li.checa.nao { color: var(--cobre); }
.req .ver { align-self: flex-start; min-height: 32px; padding: 0; color: var(--cobre); font-size: 13px; }
.rodape { font-family: var(--mono); font-size: 12px; color: #8A939C; text-align: center; }
.erro-req { color: var(--erro); font-family: var(--mono); font-size: 13px; }

/* testes */
.testes { flex: 1; overflow: auto; background: var(--area); padding: 32px 24px 48px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 32px; }
.testes .coluna { flex: 1 1 420px; max-width: 560px; display: flex; flex-direction: column; gap: 16px; }
.testes .coluna.placa { flex: 0 1 560px; gap: 10px; }
.testes h2 { margin: 0; font-size: 17px; font-weight: 600; }
.etapas { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.etapa { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; }
.etapa .bola { width: 26px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 13px; font-weight: 600; }
.etapa .meio { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.etapa .nome-etapa { font-size: 14px; font-weight: 500; }
.etapa .detalhe { font-size: 13px; color: var(--sec); line-height: 1.45; }
.etapa code { align-self: flex-start; margin-top: 4px; font-family: var(--mono); font-size: 12px; background: var(--area); padding: 4px 8px; border-radius: 6px; color: var(--texto); }
.etapa .estado { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.etapa.ok .bola { background: #173A26; color: var(--ok); } .etapa.ok .estado { color: var(--ok); }
.etapa.rodando { border-color: #5A4527; } .etapa.rodando .bola { background: #3A2E17; color: var(--cobre); } .etapa.rodando .estado { color: var(--cobre); }
.etapa.falhou { border-color: #6B2A2A; } .etapa.falhou .bola { background: #3A1A1A; color: var(--erro); } .etapa.falhou .estado { color: var(--erro); }
.etapa.aguardando .bola, .etapa.nao_rodou .bola { background: #22272C; color: #6B747D; }
.etapa.aguardando .estado, .etapa.nao_rodou .estado { color: #8A939C; }
.testes .titulo-placa { font-size: 13px; font-weight: 600; color: var(--sec); }
.links { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.links button, .links a { min-height: 36px; padding: 0; color: var(--cobre); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; }

/* desenho da placa (unidades em mm) */
.placa-fundo { fill: var(--placa); stroke: #C8CDD2; stroke-width: 0.25; }
.furo { fill: var(--area); stroke: #C8CDD2; stroke-width: 0.15; }
.corpo { fill: rgba(0,0,0,0.001); stroke: #F4F4F2; stroke-width: 0.15; }
.corpo.modulo { stroke-dasharray: 0.8 0.5; }
.trilha { stroke: var(--cobre); stroke-linecap: round; fill: none; }
.pad { fill: var(--cobre); }
.broca { fill: var(--area); pointer-events: none; }
.ref { fill: #F4F4F2; font-family: var(--mono); pointer-events: none; }
.apagado { opacity: 0.18; }
.sel { fill: none; stroke: var(--destaque); stroke-width: 0.3; pointer-events: none; }
.sel-pino { fill: none; stroke: #FFFFFF; stroke-width: 0.25; pointer-events: none; }
.erro { fill: none; stroke: #FF6B5E; stroke-width: 0.35; stroke-dasharray: 0.9 0.5; pointer-events: none; }
.novo { fill: none; stroke: var(--ok); stroke-width: 0.25; stroke-dasharray: 0.8 0.5; pointer-events: none; }
.etiqueta rect { pointer-events: none; }
.etiqueta text { font-family: var(--mono); font-weight: 500; pointer-events: none; }
[data-alvo] { cursor: pointer; }
.area.mao [data-alvo] { cursor: inherit; }
</style>
</head>
<body>
<header>
  <a class="voltar" id="voltar" href="./" aria-label="Voltar aos projetos" title="Projetos">←</a>
  <span class="nome" id="nome">Bancada de placas</span>
  <nav aria-label="Abas" id="abas">
    <button type="button" data-aba="processo">Processo</button>
    <button type="button" data-aba="thinking">Thinking</button>
    <button type="button" data-aba="projeto">Projeto</button>
    <button type="button" data-aba="testes">Testes</button>
  </nav>
  <div class="direita" id="direita">
    <button type="button" class="pilula" id="status" data-aba="testes"></button>
    <button type="button" class="pilula" id="relogio" aria-expanded="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span id="versao-label">v?</span>
    </button>
  </div>
  <div class="versoes" id="versoes" hidden></div>
</header>
<main id="main"></main>

<script>
// a bancada so le os arquivos que os scripts escrevem e desenha; nada aqui decide nada
// sem ?placa= abre a tela de projetos; com ela, a bancada daquela placa
const PLACA = new URLSearchParams(location.search).get('placa');
const BASE = `../placas/${encodeURIComponent(PLACA)}/`;

const S = {
  aba: 'processo', detalhado: false,
  api: false,            // true quando a pagina vem do app.py (da pra rodar os testes daqui)
  cotacao: null,         // fabrica.json: o que aconteceu no site da fabrica
  modelo: null, testes: null, versoes: [],
  brutos: {},            // ultimo texto lido de cada arquivo, pra saber se mudou
  modelosVersao: {},     // v -> modelo daquela versao (versoes/vN.json)
  ver: null,             // versao escolhida no relogio; null = atual
  destacar: false,
  sel: null,             // {k:'peca'|'pino'|'trilha'|'furo', ...}
  modo: 'seta', zoom: 1, cx: null, cy: null, arrastando: null,
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mm = (v, casas = 2) => Number(v).toFixed(casas).replace('.', ',');
const $ = sel => document.querySelector(sel);

// ---------- leitura dos arquivos (polling de 1 s) ----------
async function ler(caminho) {
  try {
    const r = await fetch(BASE + caminho, { cache: 'no-store' });
    return r.ok ? await r.text() : null;
  } catch { return null; }
}

async function lerJson(caminho, chave) {
  const txt = await ler(caminho);
  if (txt === null || txt === S.brutos[chave]) return false;
  try {
    const dado = JSON.parse(txt);
    S.brutos[chave] = txt;
    return dado;
  } catch { return false; }   // arquivo pela metade: tenta no proximo ciclo
}

async function atualizar() {
  const [modelo, testes, versoes, cotacao] = await Promise.all([
    lerJson('saida/modelo.json', 'modelo'), lerJson('testes.json', 'testes'), lerJson('versoes/versoes.json', 'versoes'),
    lerJson('fabrica.json', 'cotacao'),
  ]);
  if (modelo) S.modelo = modelo;
  if (testes) {
    // os requisitos so sao gravados no fim da rodada; enquanto roda, fica o objetivo da rodada anterior
    if (testes.rodando && !testes.objetivo && S.testes?.objetivo) testes.objetivo = S.testes.objetivo;
    S.testes = testes;
  }
  if (versoes) S.versoes = versoes;
  if (cotacao) S.cotacao = cotacao;
  if (modelo || testes || versoes || cotacao) desenhar();
}

async function modeloDaVersao(v) {
  if (!S.modelosVersao[v]) {
    const txt = await ler(`versoes/v${v}.json`);
    if (txt) S.modelosVersao[v] = JSON.parse(txt);
  }
  return S.modelosVersao[v];
}

function versaoAtual() { return S.modelo?.versao ?? S.versoes.at(-1)?.v ?? null; }

function modeloVisto() {
  if (S.ver && S.ver !== versaoAtual()) return S.modelosVersao[S.ver] || null;
  return S.modelo;
}

// ---------- consultas no modelo ----------
function pinoDe(m, nome) {
  const [ref, n] = nome.split('.');
  return m.pecas.find(p => p.ref === ref)?.pinos.find(p => p.n === n);
}

function pinosDaNet(m, net) {
  const lista = [];
  for (const p of m.pecas) for (const pino of p.pinos) if (net && pino.net === net) lista.push(`${p.ref}.${pino.n}`);
  return lista;
}

// o que mudou da versao anterior pra esta (pra "destacar o que mudou")
function novidades(m, ant) {
  const novos = new Set();
  if (!ant) return novos;
  for (const p of m.pecas) {
    const a = ant.pecas.find(q => q.ref === p.ref);
    if (!a || a.tipo !== p.tipo || a.x !== p.x || a.y !== p.y) novos.add('peca:' + p.ref);
  }
  m.trilhas.forEach((t, i) => {
    if (!ant.trilhas.some(a => a.de === t.de && a.ate === t.ate)) novos.add('trilha:' + i);
  });
  return novos;
}

// ---------- desenho da placa em SVG ----------
// o: {sel, novos:Set, erros:{ref:texto}, interativo}
function placaSVG(m, o = {}) {
  const W = m.placa.w, H = m.placa.h, Y = y => H - y;   // origem do txt e embaixo; a do SVG, em cima
  const fonte = Math.max(1.2, Math.min(2.2, Math.min(W, H) / 22));
  const alvo = a => o.interativo ? ` data-alvo="${a}"` : '';

  // foco: ao escolher pino/trilha/peca, apaga o que nao e da mesma net
  let nets = null, refs = null;
  if (o.sel?.k === 'pino') { nets = new Set([pinoDe(m, o.sel.nome)?.net || o.sel.nome]); refs = new Set(); }
  if (o.sel?.k === 'trilha') { nets = new Set([m.trilhas[o.sel.i]?.net]); refs = new Set(); }
  if (o.sel?.k === 'peca') {
    const p = m.pecas.find(q => q.ref === o.sel.ref);
    nets = new Set(p?.pinos.map(x => x.net).filter(Boolean)); refs = new Set([o.sel.ref]);
  }
  const apaga = (net, ref) => nets && !(refs.has(ref) || (net && nets.has(net))) ? ' apagado' : '';
  const pinoApagado = (p, pino) => {
    if (!nets) return '';
    if (o.sel.k === 'pino') return o.sel.nome === `${p.ref}.${pino.n}` || (pino.net && nets.has(pino.net)) ? '' : ' apagado';
    return apaga(pino.net, p.ref);
  };

  let s = `<rect class="placa-fundo${nets ? ' apagado' : ''}" x="0" y="0" width="${W}" height="${H}" rx="0.6"${alvo('placa')}/>`;
  m.furos.forEach((f, i) => {
    s += `<circle class="furo${nets ? ' apagado' : ''}" cx="${f.x}" cy="${Y(f.y)}" r="${f.d / 2}"${alvo('furo:' + i)}/>`;
  });
  for (const p of m.pecas) {
    const c = p.corpo, x = p.x - c.w / 2, y = Y(p.y) - c.h / 2;
    const raio = c.redondo ? Math.min(c.w, c.h) / 2 : 0.4;
    s += `<rect class="corpo${p.pinos.length > 8 ? ' modulo' : ''}${apaga(null, p.ref)}" x="${x}" y="${y}" width="${c.w}" height="${c.h}" rx="${raio}"${alvo('peca:' + p.ref)}/>`;
  }
  m.trilhas.forEach((t, i) => {
    s += `<line class="trilha${apaga(t.net, null)}" x1="${t.x1}" y1="${Y(t.y1)}" x2="${t.x2}" y2="${Y(t.y2)}" stroke-width="${t.largura}"${alvo('trilha:' + i)}/>`;
  });
  for (const p of m.pecas) {
    for (const pino of p.pinos) {
      const a = alvo(`pino:${p.ref}.${pino.n}`), cl = `pad${pinoApagado(p, pino)}`;
      if (pino.pad.forma === 'C') s += `<circle class="${cl}" cx="${pino.x}" cy="${Y(pino.y)}" r="${pino.pad.d / 2}"${a}/>`;
      else s += `<rect class="${cl}" x="${pino.x - pino.pad.w / 2}" y="${Y(pino.y) - pino.pad.h / 2}" width="${pino.pad.w}" height="${pino.pad.h}" rx="0.15"${a}/>`;
      if (pino.furo) s += `<circle class="broca${pinoApagado(p, pino)}" cx="${pino.x}" cy="${Y(pino.y)}" r="${pino.furo / 2}"/>`;
    }
  }
  for (const p of m.pecas) {
    s += `<text class="ref${apaga(null, p.ref)}" x="${p.x}" y="${Y(p.y) - p.corpo.h / 2 - fonte * 0.45}" font-size="${fonte}" text-anchor="middle">${esc(p.ref)}</text>`;
  }

  // camadas por cima: selecao, novidades, erros
  const contorno = (ref, classe, folga) => {
    const p = m.pecas.find(q => q.ref === ref);
    if (!p) return '';
    const c = p.corpo, f = folga;
    const raio = c.redondo ? Math.min(c.w, c.h) / 2 + f : 0.8;
    return `<rect class="${classe}" x="${p.x - c.w / 2 - f}" y="${Y(p.y) - c.h / 2 - f}" width="${c.w + 2 * f}" height="${c.h + 2 * f}" rx="${raio}"/>`;
  };
  if (o.sel?.k === 'peca') s += contorno(o.sel.ref, 'sel', 0.6);
  if (o.sel?.k === 'pino') {
    const pino = pinoDe(m, o.sel.nome);
    if (pino) s += `<circle class="sel-pino" cx="${pino.x}" cy="${Y(pino.y)}" r="${(pino.pad.d ?? Math.max(pino.pad.w, pino.pad.h)) / 2 + 0.45}"/>`;
  }
  for (const [ref, rotulo] of Object.entries(o.erros || {})) {
    const p = m.pecas.find(q => q.ref === ref);
    if (!p) continue;
    s += contorno(ref, 'erro', 1.2);
    if (rotulo) s += etiquetaAoLado(p, Y, W, rotulo, fonte * 0.8, 'var(--erro)', '#2A0B08');
  }
  for (const k of o.novos || []) {
    const [tipo, id] = k.split(':');
    if (tipo === 'peca') {
      s += contorno(id, 'novo', 1.0);
      const p = m.pecas.find(q => q.ref === id);
      s += etiquetaAoLado(p, Y, W, '+ novo', fonte * 0.8, 'var(--ok)', '#0E2A1A');
    } else {
      const t = m.trilhas[+id];
      s += `<line class="novo" x1="${t.x1}" y1="${Y(t.y1)}" x2="${t.x2}" y2="${Y(t.y2)}" stroke-width="${t.largura + 0.9}" stroke-opacity="0.8"/>`;
    }
  }
  return s;
}

function larguraEtiqueta(texto, fonte) { return texto.length * fonte * 0.62 + fonte * 1.2; }

// etiqueta no canto de cima da peca; vai pro lado esquerdo se nao couber na placa
function etiquetaAoLado(p, Y, W, texto, fonte, fundo, cor) {
  const w = larguraEtiqueta(texto, fonte), dir = p.x + p.corpo.w / 2 + 1.4;
  const x = dir + w <= W ? dir : p.x - p.corpo.w / 2 - 1.4 - w;
  return etiqueta(x, Y(p.y) - p.corpo.h / 2 - 0.4, texto, fonte, fundo, cor);
}

function etiqueta(x, y, texto, fonte, fundo, cor) {
  const w = larguraEtiqueta(texto, fonte), h = fonte * 1.6;
  return `<g class="etiqueta"><rect x="${x}" y="${y - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${fundo}"/>` +
    `<text x="${x + w / 2}" y="${y + fonte * 0.35}" font-size="${fonte}" text-anchor="middle" fill="${cor}">${esc(texto)}</text></g>`;
}

// requisitos (do testes.json) que citam essa peca
function requisitosDa(ref) {
  return (S.testes?.objetivo?.itens || []).filter(i => i.pecas.includes(ref)).map(i => `${i.id} ${i.titulo}`).join(' · ');
}

// o que o inspetor mostra pra cada coisa clicada
function inspecionar(m, sel) {
  if (sel.k === 'peca') {
    const p = m.pecas.find(q => q.ref === sel.ref);
    if (!p) return null;
    const usados = p.pinos.filter(x => x.net && pinosDaNet(m, x.net).length > 1);
    const ligacao = x => pinosDaNet(m, x.net).filter(n => n !== `${p.ref}.${x.n}`).join(', ') || '—';
    const linhas = p.pinos.length > 4
      ? [['Pinos', String(p.pinos.length)], ['Usados', String(usados.length)], ...usados.map(x => [`Pino ${x.n}`, ligacao(x)])]
      : p.pinos.map(x => [`Pino ${x.n}`, x.net ? ligacao(x) : 'nada ainda']);
    linhas.push(['Posição', `${mm(p.x, 1)}, ${mm(p.y, 1)} mm`]);
    if (p.exemplo) linhas.push(['Medidas', 'de exemplo, sem datasheet', true]);
    return { tipo: p.nome, titulo: p.ref, linhas, linha: p.linha, explica: p.explica };
  }
  if (sel.k === 'pino') {
    const [ref, n] = sel.nome.split('.');
    const p = m.pecas.find(q => q.ref === ref), pino = pinoDe(m, sel.nome);
    if (!pino) return null;
    const outros = pinosDaNet(m, pino.net).filter(x => x !== sel.nome);
    const linhas = [['Net', pino.net || '—'], ['Ligado a', outros.join(', ') || 'nada ainda'],
      ['Furo', pino.furo ? `${mm(pino.furo)} mm (passante)` : 'não (superfície)'], ['Posição', `${mm(pino.x)}, ${mm(pino.y)} mm`]];
    const dentro = (p.juntos || []).filter(par => par.includes(n)).map(par => `${ref}.${par[0] === n ? par[1] : par[0]}`);
    const fora = outros.filter(x => !dentro.includes(x));
    let explica = `Pino ${n} de ${ref} (${p.nome}). `;
    if (dentro.length) explica += `Por dentro da peça ele já é ligado no ${dentro.join(', ')}. `;
    if (pino.net === 'GND') explica += 'Está no GND, o terra: o 0 V de referência de todo o circuito.';
    else if (!fora.length) explica += dentro.length ? 'Por fora, ainda não vai pra lugar nenhum.' : 'Ainda não está ligado em nada.';
    else explica += `A trilha leva o sinal dele até ${fora.join(', ')}; tudo isso é a mesma net (${pino.net}).`;
    return { tipo: 'Pino', titulo: sel.nome, linhas, linha: p.linha, explica };
  }
  if (sel.k === 'trilha') {
    const t = m.trilhas[sel.i];
    if (!t) return null;
    const comp = Math.hypot(t.x2 - t.x1, t.y2 - t.y1);
    return { tipo: 'Trilha', titulo: `${t.de} → ${t.ate}`, linha: t.linha,
      linhas: [['Net', t.net], ['Largura', `${mm(t.largura)} mm`], ['Comprimento', `${mm(comp, 1)} mm`]],
      explica: 'Um caminho de cobre na placa: é o fio que liga um pino no outro. Por enquanto sai sempre em linha reta.' };
  }
  if (sel.k === 'furo') {
    const f = m.furos[sel.i];
    if (!f) return null;
    const linhas = [['Diâmetro', `${mm(f.d, 1)} mm`], ['Posição', `${mm(f.x, 1)}, ${mm(f.y, 1)} mm`]];
    if (f.d >= 3.1 && f.d <= 3.4) linhas.splice(1, 0, ['Parafuso', 'M3']);
    return { tipo: 'Furo', titulo: 'Fixação', linhas, linha: f.linha,
      explica: 'Furo sem cobre pra prender a placa numa caixa ou base com parafuso.' };
  }
  return null;
}

// ---------- zoom e arrasto (mexem so no viewBox) ----------
function areaInfo() {
  const area = $('.area'), m = modeloVisto();
  if (!area || !m) return null;
  const r = area.getBoundingClientRect();
  const base = Math.min((r.width - 150) / m.placa.w, (r.height - 64) / m.placa.h);   // sobra espaco pras ferramentas
  return { area, r, base, m };
}

function centralizar() {
  const m = modeloVisto();
  S.zoom = 1; S.cx = m.placa.w / 2; S.cy = m.placa.h / 2;
}

function aplicarZoom() {
  const a = areaInfo();
  if (!a) return;
  const k = a.base * S.zoom, vw = a.r.width / k, vh = a.r.height / k;
  a.area.querySelector('.desenho').setAttribute('viewBox', `${S.cx - vw / 2} ${S.cy - vh / 2} ${vw} ${vh}`);
  a.area.querySelector('.zoom').textContent = Math.round(S.zoom * 100) + '%';
}

function zoomEm(fator, px, py) {
  const a = areaInfo();
  if (!a) return;
  if (px === undefined) { px = a.r.width / 2; py = a.r.height / 2; }
  const novo = Math.min(12, Math.max(0.4, S.zoom * fator));
  const k1 = a.base * S.zoom, k2 = a.base * novo;
  // o ponto embaixo do mouse continua no mesmo lugar
  S.cx += (px - a.r.width / 2) * (1 / k1 - 1 / k2);
  S.cy += (py - a.r.height / 2) * (1 / k1 - 1 / k2);
  S.zoom = novo;
  aplicarZoom();
}

function nomeDoAlvo(m, alvo) {
  const [k, id] = alvo.split(':');
  if (k === 'peca') { const p = m.pecas.find(q => q.ref === id); return `${id} · ${p?.nome ?? ''}`; }
  if (k === 'pino') { const pino = pinoDe(m, id); return pino?.net ? `${id} · ${pino.net}` : id; }
  if (k === 'trilha') { const t = m.trilhas[+id]; return t ? `trilha ${t.de} → ${t.ate}` : 'trilha'; }
  if (k === 'furo') return 'Furo de fixação';
  return 'Placa';
}

function selecaoDoAlvo(alvo) {
  const [k, id] = alvo.split(':');
  if (k === 'peca') return { k, ref: id };
  if (k === 'pino') return { k, nome: id };
  if (k === 'trilha' || k === 'furo') return { k, i: +id };
  return null;
}

// ---------- tela inicial: os projetos ----------
async function lerDe(url) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

async function listarPlacas() {
  const api = await lerDe('/api/placas');
  if (api) { S.api = true; return api.placas; }
  try {   // sem o app.py (python -m http.server): le a listagem da pasta
    const html = await (await fetch('../placas/', { cache: 'no-store' })).text();
    return [...html.matchAll(/href="([^"/?#]+)\/"/g)].map(x => decodeURIComponent(x[1]));
  } catch { return []; }
}

function miniatura(m, o = {}) {
  const pad = 4;
  return `<svg class="mini" viewBox="${-pad} ${-pad} ${m.placa.w + 2 * pad} ${m.placa.h + 2 * pad}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placa">${placaSVG(m, o)}</svg>`;
}

function selosDe(t, m, cotacao) {
  let testes = '<span class="selo">sem testes</span>';
  if (t?.rodando) testes = '<span class="selo rodando">testes rodando…</span>';
  else if (t) {
    const falhas = t.etapas.filter(e => e.estado === 'falhou').length;
    testes = falhas ? `<span class="selo falha">✗ ${falhas} etapa falhou</span>` : '<span class="selo ok">✓ testes ok</span>';
  }
  let fabrica = '';
  if (cotacao) fabrica = `<span class="selo ok">fábrica: ${esc(cotacao.situacao || 'cotado')}</span>`;
  else if (m?.fabrica?.pronta) fabrica = '<span class="selo">fabrica.zip pronto</span>';
  else if (m?.fabrica) fabrica = '<span class="selo">fabrica.zip travado</span>';
  return testes + fabrica;
}

async function desenharInicio() {
  const nomes = await listarPlacas();
  const placas = await Promise.all(nomes.map(async nome => {
    const base = `../placas/${encodeURIComponent(nome)}/`;
    const [modelo, testes, versoes, cotacao] = await Promise.all(
      ['saida/modelo.json', 'testes.json', 'versoes/versoes.json', 'fabrica.json'].map(c => lerDe(base + c)));
    return { nome, modelo, testes, versoes: versoes || [], cotacao };
  }));
  placas.sort((a, b) => (b.versoes.at(-1)?.quando || '').localeCompare(a.versoes.at(-1)?.quando || ''));
  const cartoes = placas.map(p => {
    const v = p.versoes.at(-1);
    return `<a class="cartao" href="?placa=${encodeURIComponent(p.nome)}">
      ${p.modelo ? miniatura(p.modelo) : '<div class="sem-placa">ainda não foi gerada</div>'}
      <span class="titulo-cartao">${esc(p.testes?.objetivo?.titulo || p.nome)}</span>
      <span class="sub mono">placas/${esc(p.nome)}${v ? ` · v${v.v} · ${esc(v.quando)}` : ''}</span>
      <span class="selos">${selosDe(p.testes, p.modelo, p.cotacao)}</span>
    </a>`;
  }).join('');
  const html = `<section class="inicio" aria-label="Projetos"><div class="miolo">
    <div><h1>Projetos</h1><span class="sub">${placas.length} ${placas.length === 1 ? 'placa' : 'placas'} em placas/</span></div>
    ${placas.length ? `<div class="cartoes">${cartoes}</div>` : '<p class="vazio">Nenhuma placa em <span class="mono">placas/</span> ainda.</p>'}
  </div></section>`;
  if (html !== S.brutos.inicio) $('#main').innerHTML = S.brutos.inicio = html;   // so troca se mudou (nao engole clique)
}

// ---------- aba Processo: a historia do projeto ----------
function passo(n, estado, titulo, corpo) {
  return `<li class="passo ${estado}"><span class="marca" aria-hidden="true">${estado === 'ok' ? '✓' : n}</span>
    <div class="conteudo"><h3>${n}. ${titulo}</h3>${corpo}</div></li>`;
}

function desenharProcesso(main) {
  const m = S.modelo, t = S.testes, obj = t?.objetivo, c = S.cotacao;
  const reqs = obj?.itens || [];
  const falha = t && !t.rodando && t.etapas.find(e => e.estado === 'falhou');

  const p1 = obj ? passo(1, reqs.length && reqs.every(i => i.status === 'ok') ? 'ok' : 'falha', 'Objetivo', `
      <p class="destaque">${esc(obj.titulo)}</p>${obj.texto ? `<p>${esc(obj.texto)}</p>` : ''}
      <ul class="reqs">${reqs.map(i => `<li class="${i.status === 'ok' ? 'ok' : 'falha'}">${i.status === 'ok' ? '✓' : '✗'} ${esc(i.id)} ${esc(i.titulo)}${i.status === 'ok' ? '' : ` · ${esc(i.motivo)}`}</li>`).join('')}</ul>
      <button type="button" class="link" data-aba="thinking">Ver os requisitos →</button>`)
    : passo(1, 'pendente', 'Objetivo', '<p>Ainda não tem <span class="mono">requisitos.md</span>.</p>');

  const versoes = [...S.versoes].reverse();
  const p2 = m ? passo(2, 'ok', 'Placa', `<div class="placa-resumo">${miniatura(m)}<div style="display:flex;flex-direction:column;gap:10px">
      <span class="sub mono">${mm(m.placa.w, 0)} × ${mm(m.placa.h, 0)} mm · ${m.pecas.length} peças · ${m.trilhas.length} trilhas</span>
      <ol class="versoes-lista">${versoes.map(v => `<li><span class="mono">v${v.v}</span> ${esc(v.frase)} <span class="sub">· ${esc(v.quando)}</span></li>`).join('')}</ol>
      <button type="button" class="link" data-aba="projeto">Abrir a placa →</button></div></div>`)
    : passo(2, 'pendente', 'Placa', '<p>Ainda não foi gerada.</p>');

  const rodar = S.api ? '<button type="button" class="link" data-rodar>Rodar os testes de novo ↻</button>' : '';
  let p3 = passo(3, 'pendente', 'Testes', `<p>Ainda não rodou.</p><div class="links">${rodar}</div>`);
  if (t) {
    const texto = t.rodando ? 'Rodando agora…'
      : falha ? `Parou na etapa ${t.etapas.indexOf(falha) + 1}, ${esc(falha.nome.toLowerCase())}: ${esc(falha.detalhe)}`
      : `As ${t.etapas.length} etapas passaram: lê o txt, peças, ligações, regras da fábrica, relê o Gerber e tira a foto.`;
    p3 = passo(3, t.rodando ? 'rodando' : falha ? 'falha' : 'ok', 'Testes', `<p>${texto}</p>
      ${!t.rodando && t.resumo ? `<div class="explica"><b>Resumo do Claude</b><p>${esc(t.resumo)}</p></div>` : ''}
      <div class="links"><button type="button" class="link" data-aba="testes">Ver as etapas →</button>${rodar}</div>`);
  }

  let corpo4 = '<p>Ainda não foi gerada.</p>', estado4 = 'pendente';
  if (m?.fabrica && !m.fabrica.pronta) {
    corpo4 = `<p>O <span class="mono">fabrica.zip</span> fica travado enquanto tiver medida de exemplo, sem datasheet: ${esc(m.fabrica.falta_datasheet.join(', '))}.</p>`;
  } else if (m?.fabrica && (falha || !t)) {
    corpo4 = '<p>O <span class="mono">fabrica.zip</span> sai quando todos os testes passarem.</p>';
  } else if (m?.fabrica) {
    corpo4 = `<p>O <span class="mono">fabrica.zip</span> está pronto: contorno, cobre de cima e de baixo, máscara, serigrafia e os furos com e sem cobre.</p>
      <div class="links"><a class="link" href="${BASE}saida/fabrica.zip" download>Baixar fabrica.zip ↓</a></div>`;
  }
  if (c) {
    estado4 = 'ok';
    corpo4 += `<div class="cotacao"><dl>
        <dt>Site</dt><dd>${esc(c.site)}</dd><dt>Situação</dt><dd>${esc(c.situacao)}</dd>
        ${c.detectou ? `<dt>A fábrica leu</dt><dd>${esc(c.detectou)}</dd>` : ''}
        ${c.preco ? `<dt>Preço</dt><dd>${esc(c.preco)}</dd>` : ''}
        <dt>Quando</dt><dd>${esc(c.quando)}${c.versao ? ` · v${esc(c.versao)}` : ''}</dd></dl>
      ${c.imagem ? `<a href="${BASE}${esc(c.imagem)}" target="_blank" rel="noopener"><img src="${BASE}${esc(c.imagem)}" alt="Cotação no site da ${esc(c.site)}"></a>` : ''}
      ${/^https:\/\//.test(c.url || '') ? `<a class="link" href="${esc(c.url)}" target="_blank" rel="noopener">Abrir o site da ${esc(c.site)} ↗</a>` : ''}</div>`;
  }
  const p4 = passo(4, estado4, 'Fábrica', corpo4);
  main.innerHTML = `<section class="processo" aria-label="Processo"><ol class="passos">${p1}${p2}${p3}${p4}</ol></section>`;
}

// ---------- aba Thinking ----------
function desenharThinking(main) {
  const obj = S.testes?.objetivo;
  if (!obj) { main.innerHTML = `<p class="vazio">Ainda não tem <span class="mono">requisitos.md</span> (ou os testes não rodaram depois dele).</p>`; return; }
  const cards = obj.itens.map(i => {
    const classe = i.status === 'ok' ? 'ok' : i.status === 'falha' ? 'falha' : '';
    const detalhes = S.detalhado ? `<ul>
        ${i.detalhes.map(d => `<li>${esc(d)}</li>`).join('')}
        ${(i.verifica || []).map(v => `<li class="checa${v.ok === false ? ' nao' : ''}">${v.ok ? '✓' : v.ok === false ? '✗' : '·'} ${esc(v.texto)}</li>`).join('')}
      </ul>` : '';
    const primeira = i.pecas.find(r => S.modelo?.pecas.some(p => p.ref === r));
    return `<div class="galho"><article class="req ${classe}">
      <span class="status">${esc(i.motivo || i.status)}</span>
      <span class="titulo-req">${esc(i.titulo)}</span>
      <span class="pecas">${esc(i.id)} · ${esc(i.pecas.join(' · ') || 'sem peças')}</span>
      ${detalhes}
      ${primeira ? `<button type="button" class="ver" data-abrir="${esc(primeira)}">Ver na placa →</button>` : ''}
    </article></div>`;
  }).join('');
  main.innerHTML = `<section class="thinking" aria-label="Thinking">
    <div class="modos" role="group" aria-label="Modo">
      <button type="button" data-detalhado="0" aria-pressed="${!S.detalhado}">Simples</button>
      <button type="button" data-detalhado="1" aria-pressed="${S.detalhado}">Detalhado</button>
    </div>
    <div class="arvore">
      <div class="objetivo"><span class="rotulo">Objetivo</span><span class="titulo-obj">${esc(obj.titulo || PLACA)}</span>${obj.texto ? `<p>${esc(obj.texto)}</p>` : ''}</div>
      ${obj.itens.length ? `<div class="tronco"></div><div class="galhos">${cards}</div>` : ''}
    </div>
    ${obj.erro ? `<p class="erro-req">${esc(obj.erro)}</p>` : ''}
    <span class="rodape">requisitos.md · status calculado pelos testes, sem IA</span>
  </section>`;
}

// ---------- aba Testes ----------
const ESTADOS = { ok: ['✓', 'ok'], rodando: ['…', 'rodando'], falhou: ['✗', 'falhou'], nao_rodou: ['·', 'não rodou'], aguardando: ['·', 'aguardando'] };

function hora(iso) { return iso ? iso.slice(11, 16) : ''; }

function desenharTestes(main) {
  const t = S.testes;
  if (!t) { main.innerHTML = `<p class="vazio">Ainda não rodou nenhum teste.<br>Rode <span class="mono">python ferramenta/testar.py placas/${esc(PLACA)}</span>.</p>`; return; }
  const falha = !t.rodando && t.etapas.find(e => e.estado === 'falhou');
  const m = S.modelo;
  const erros = falha ? (falha.rotulos || {}) : {};
  const quando = t.rodando ? `começou ${hora(t.inicio)}` : `rodou ${hora(t.fim || t.inicio)}`;
  const fotoOk = t.etapas[5]?.estado === 'ok';

  const etapas = t.etapas.map(e => {
    const [icone, texto] = ESTADOS[e.estado] || ESTADOS.aguardando;
    let detalhe = e.estado === 'ok' || e.estado === 'falhou' ? e.detalhe : '';
    if (e.estado === 'falhou' && e.requisitos?.length) detalhe += ` · requisitos ${e.requisitos.join(', ')}`;
    return `<li class="etapa ${esc(e.estado)}">
      <span class="bola" aria-hidden="true">${icone}</span>
      <div class="meio"><span class="nome-etapa">${esc(e.nome)}</span>
        ${detalhe ? `<span class="detalhe">${esc(detalhe)}</span>` : ''}
        ${e.codigo ? `<code>${esc(e.codigo)}</code>` : ''}</div>
      <span class="estado">${texto}</span></li>`;
  }).join('');

  const placa = m ? miniatura(m, { erros }) : '';
  const titulo = t.rodando ? 'Conferindo a placa…' : falha ? 'Onde está o problema' : 'Placa sem problemas';
  const links = Object.keys(erros).filter(ref => m?.pecas.some(p => p.ref === ref))
    .map(ref => `<button type="button" data-abrir="${esc(ref)}">Abrir ${esc(ref)} no Projeto →</button>`).join('');

  main.innerHTML = `<section class="testes" aria-label="Testes">
    <div class="coluna">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
        <div><h2>Rodada de testes</h2><span class="sub">${t.versao ? 'v' + t.versao + ' · ' : ''}${quando} · testes.json</span></div>
        ${S.api ? `<button type="button" class="pilula" data-rodar ${t.rodando ? 'disabled' : ''}>Rodar de novo ↻</button>` : ''}
      </div>
      <ol class="etapas">${etapas}</ol>
      ${!t.rodando && t.resumo ? `<div class="explica"><b>Resumo do Claude · só no final</b><p>${esc(t.resumo)}</p></div>` : ''}
    </div>
    <div class="coluna placa">
      <span class="titulo-placa">${titulo}</span>
      ${placa}
      <div class="links">${links}${fotoOk ? `<a href="${BASE}saida/foto.png" target="_blank" rel="noopener">Ver a foto tirada do Gerber ↗</a>` : ''}</div>
      ${m?.fabrica ? (m.fabrica.pronta && !falha && !t.rodando
        ? `<div class="links"><a href="${BASE}saida/fabrica.zip" download>Baixar fabrica.zip ↓</a></div>`
        : `<span class="sub">fabrica.zip ${m.fabrica.pronta ? 'sai quando todos os testes passarem' : 'bloqueado: medidas de exemplo em ' + esc(m.fabrica.falta_datasheet.join(', '))}</span>`) : ''}
    </div>
  </section>`;
}

// ---------- desenha a aba certa ----------
function desenhar() {
  desenharTopo();
  const main = $('#main');
  if (main.dataset.aba !== S.aba) { main.innerHTML = ''; main.dataset.aba = S.aba; }
  if (S.aba === 'projeto') desenharProjeto(main);
  else if (S.aba === 'testes') desenharTestes(main);
  else if (S.aba === 'thinking') desenharThinking(main);
  else desenharProcesso(main);
}

function irPara(aba, sel) {
  S.aba = aba;
  if (sel !== undefined) S.sel = sel;
  $('#versoes').hidden = true;
  desenhar();
}

// ---------- eventos ----------
document.addEventListener('click', async e => {
  if (!e.target.closest('#versoes, #relogio')) $('#versoes').hidden = true;
  const b = e.target.closest('button, input, [data-alvo]');
  if (!b) return;
  if (b.dataset.aba) return irPara(b.dataset.aba);
  if (b.id === 'relogio') {
    const lista = $('#versoes');
    lista.hidden = !lista.hidden;
    b.setAttribute('aria-expanded', !lista.hidden);
    return desenharTopo();
  }
  if (b.dataset.versao) {
    const v = +b.dataset.versao;
    S.ver = v === versaoAtual() ? null : v;
    await Promise.all([modeloDaVersao(v), v > 1 && modeloDaVersao(v - 1)]);
    S.sel = null; S.cx = null;
    $('#versoes').hidden = true;
    return desenhar();
  }
  if (b.id === 'destacar') {
    S.destacar = b.checked;
    const v = S.ver ?? versaoAtual();
    if (v > 1) await modeloDaVersao(v - 1);
    return desenhar();
  }
  if ('rodar' in b.dataset) {
    b.disabled = true;
    await fetch(`/api/testar?placa=${encodeURIComponent(PLACA)}`, { method: 'POST', headers: { 'X-Bancada': '1' } }).catch(() => null);
    return;
  }
  if (b.dataset.abrir) { S.ver = null; S.cx = null; return irPara('projeto', { k: 'peca', ref: b.dataset.abrir }); }
  if (b.dataset.detalhado) { S.detalhado = b.dataset.detalhado === '1'; return desenhar(); }
  if (b.dataset.modo) { S.modo = b.dataset.modo; return desenhar(); }
  if (b.dataset.zoom) return zoomEm(+b.dataset.zoom);
  if ('centralizar' in b.dataset) { centralizar(); return aplicarZoom(); }
  if ('fechar' in b.dataset) { S.sel = null; return desenhar(); }
  if (b.dataset.alvo && S.modo === 'seta' && !S.arrastou) {
    S.sel = selecaoDoAlvo(b.dataset.alvo);
    return desenhar();
  }
});

document.addEventListener('mousedown', e => {
  const area = e.target.closest('.area');
  if (!area || e.target.closest('.ferramentas')) return;
  S.arrastou = false;
  if (S.modo === 'mao' || e.button === 1) {
    e.preventDefault();
    S.arrastando = { x: e.clientX, y: e.clientY };
    area.classList.add('arrastando');
  }
});

document.addEventListener('mousemove', e => {
  if (S.arrastando) {
    const a = areaInfo(), k = a.base * S.zoom;
    S.cx -= (e.clientX - S.arrastando.x) / k;
    S.cy -= (e.clientY - S.arrastando.y) / k;
    S.arrastando = { x: e.clientX, y: e.clientY };
    S.arrastou = true;
    aplicarZoom();
  }
  const area = e.target.closest('.area'), hud = $('.hud');
  if (!hud) return;
  if (!area || S.modo !== 'seta' || e.target.closest('.ferramentas')) { hud.hidden = true; return; }
  const m = modeloVisto(), svg = area.querySelector('.desenho');
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const dentro = pt.x >= 0 && pt.y >= 0 && pt.x <= m.placa.w && pt.y <= m.placa.h;
  const alvo = e.target.closest('[data-alvo]')?.dataset.alvo;
  if (!dentro && !alvo) { hud.hidden = true; return; }
  const r = area.getBoundingClientRect();
  hud.hidden = false;
  hud.style.left = (e.clientX - r.left + 18) + 'px';
  hud.style.top = (e.clientY - r.top + 18) + 'px';
  hud.querySelector('.nome-hud').textContent = nomeDoAlvo(m, alvo || 'placa');
  hud.querySelector('.xy').textContent = `x ${mm(pt.x, 1)}  y ${mm(m.placa.h - pt.y, 1)} mm`;
});

document.addEventListener('mouseup', () => {
  if (!S.arrastando) return;
  S.arrastando = null;
  $('.area')?.classList.remove('arrastando');
});

document.addEventListener('wheel', e => {
  const area = e.target.closest('.area');
  if (!area) return;
  e.preventDefault();
  const r = area.getBoundingClientRect();
  zoomEm(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

document.addEventListener('keydown', e => {
  if (!PLACA || e.target.closest('input, textarea')) return;
  if (e.key === 'Escape') { S.sel = null; $('#versoes').hidden = true; return desenhar(); }
  if (S.aba !== 'projeto') return;
  if (e.key === 'v') { S.modo = 'seta'; desenhar(); }
  if (e.key === 'h') { S.modo = 'mao'; desenhar(); }
  if (e.key === '+' || e.key === '=') zoomEm(1.25);
  if (e.key === '-') zoomEm(0.8);
  if (e.key === '0') { centralizar(); aplicarZoom(); }
});

window.addEventListener('resize', aplicarZoom);

if (PLACA) {
  lerDe('/api/placas').then(api => { S.api = !!api; desenhar(); });
  atualizar();
  setInterval(atualizar, 1000);
} else {   // tela de projetos: some com as abas e relê a lista de vez em quando
  for (const id of ['voltar', 'abas', 'direita']) $('#' + id).hidden = true;
  document.title = 'Bancada de placas';
  desenharInicio();
  setInterval(desenharInicio, 5000);
}
</script>
</body>
</html>
